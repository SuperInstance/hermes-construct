[package]
name = "cns-dsh-bridge"
version = "0.1.0"
edition = "2021"
description = "Lossless bridge between CNS/USCP v3 and DeepSeek Harness event bus"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full", "macros", "rt-multi-thread"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
toml = "0.8"
notify = "6.0"
prometheus = "0.13"
async-trait = "0.1"
strum = { version = "0.26", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "translation_bench"
harness = false